name: Deploy Spring Boot Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # This enables manual triggering
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests during build'
        required: false
        default: false
        type: boolean
      deploy_to_ec2:
        description: 'Deploy to EC2 instance'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # These permissions are needed to interact with GitHub's OIDC Token endpoint
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout git_action_test branch
      uses: actions/checkout@v4
      with:
        ref: git_action_test
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Build with Maven
      run: |
        if [ "${{ github.event.inputs.skip_tests }}" == "true" ]; then
          mvn clean package -DskipTests
        else
          mvn clean package
        fi
      env:
        DB_URL: ${{ secrets.DB_URL }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        BREVO_EMAIL: ${{ secrets.BREVO_EMAIL }}
        JWT_SIGNER_KEY: ${{ secrets.JWT_SIGNER_KEY }}
        CLIENT_URL: ${{ secrets.CLIENT_URL }}
        VERIFY_EMAIL_URL: ${{ secrets.VERIFY_EMAIL_URL }}

    - name: Debug Environment Variables
      run: |
        echo "DB_USERNAME is set"
        echo "DB_PASSWORD is set"
        echo "AWS_ROLE_ARN is set"
      env:
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
        aws-region: us-east-1
        audience: sts.amazonaws.com
        mask-aws-account-id: false
    
    - name: Verify AWS credentials
      run: |
        aws sts get-caller-identity
        echo "AWS CLI configured successfully"
    
    - name: Upload JAR to S3
      run: |
        aws s3 cp target/*.jar s3://${{ secrets.S3_BUCKET }}/app-${{ github.event.inputs.environment || 'main' }}.jar
    
    - name: Deploy to EC2
      if: github.event.inputs.deploy_to_ec2 != 'false'
      run: |
        aws ssm send-command \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "sudo mkdir -p /opt/book-exchange",
            "sudo chown ec2-user:ec2-user /opt/book-exchange",
            "sudo systemctl stop book-exchange || true",
            "aws s3 cp s3://${{ secrets.S3_BUCKET }}/app-${{ github.event.inputs.environment || 'main' }}.jar /opt/book-exchange/app.jar",
            "sudo chown ec2-user:ec2-user /opt/book-exchange/app.jar",
            "sudo chmod 644 /opt/book-exchange/app.jar",
            "sudo systemctl daemon-reload",
            "sudo systemctl start book-exchange",
            "sudo systemctl enable book-exchange",
            "sleep 5",
            "sudo systemctl status book-exchange"
          ]' \
          --output text
      env:
        DB_URL: ${{ secrets.DB_URL }}
        DB_USERNAME: ${{ secrets.DB_USERNAME }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        BREVO_EMAIL: ${{ secrets.BREVO_EMAIL }}
        JWT_SIGNER_KEY: ${{ secrets.JWT_SIGNER_KEY }}
        CLIENT_URL: ${{ secrets.CLIENT_URL }}
        VERIFY_EMAIL_URL: ${{ secrets.VERIFY_EMAIL_URL }}